# Keep npm and GitHub Actions dependencies current with weekly PRs.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - dependencies
      groups:
          eslint:
              patterns:
                  - 'eslint*'
                  - '@typescript-eslint/*'
          vscode-test:
              patterns:
                  - '@vscode/test-*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions
